name: Update Build Challenge SVG

on:
  schedule:
    # Runs daily at 21:00 UTC (00:00 midnight EAT, UTC+3)
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate updated SVG
        run: python scripts/update_challenge.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/challenge.svg
          git diff --staged --quiet || git commit -m "Update build challenge SVG"
          git push
