<svg xmlns="http://www.w3.org/2000/svg" width="520" height="270" viewBox="0 0 520 270" role="img" aria-labelledby="title desc">
  <title id="title">Code vortex visual</title>
  <desc id="desc">Animated rings of code symbols orbit a central full-stack system core.</desc>
  <defs>
    <radialGradient id="vortex" cx="50%" cy="50%"><stop stop-color="#0b7285" stop-opacity="0.7"/><stop offset="0.5" stop-color="#172554"/><stop offset="1" stop-color="#020617"/></radialGradient>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, monospace; }
      .ring1 { transform-origin: 260px 140px; animation: spin 9s linear infinite; }
      .ring2 { transform-origin: 260px 140px; animation: spin 13s linear reverse infinite; }
      .ring3 { transform-origin: 260px 140px; animation: spin 17s linear infinite; }
      .core { animation: breathe 2.2s ease-in-out infinite alternate; transform-origin: 260px 140px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes breathe { from { transform: scale(0.94); } to { transform: scale(1.07); } }
    </style>
  </defs>
  <rect width="520" height="270" rx="22" fill="url(#vortex)"/>
  <g fill="none" stroke="#67e8f9" stroke-opacity="0.2"><ellipse cx="260" cy="140" rx="178" ry="54"/><ellipse cx="260" cy="140" rx="126" ry="38"/><ellipse cx="260" cy="140" rx="78" ry="24"/></g>
  <g class="mono" font-size="15" text-anchor="middle">
    <g class="ring1" fill="#a7f3d0"><text x="260" y="70">API</text><text x="438" y="145">OPS</text><text x="260" y="216">DATA</text><text x="82" y="145">UI</text></g>
    <g class="ring2" fill="#fbbf24"><text x="260" y="101">&lt;/&gt;</text><text x="339" y="143">SQL</text><text x="260" y="183">CI/CD</text><text x="181" y="143">AUTH</text></g>
    <g class="ring3" fill="#c4b5fd"><text x="376" y="96">REST</text><text x="354" y="192">LOGS</text><text x="144" y="192">TEST</text><text x="122" y="96">UX</text></g>
  </g>
  <g class="core"><circle cx="260" cy="140" r="39" fill="#0f172a" stroke="#67e8f9" stroke-width="2"/><text x="260" y="149" class="mono" font-size="28" fill="#e0f2fe" text-anchor="middle">&lt;/&gt;</text></g>
  <text x="24" y="36" class="mono" font-size="13" fill="#e0f2fe" letter-spacing="2">FULL-STACK CODE VORTEX</text>
  <text x="24" y="248" class="mono" font-size="13" fill="#94a3b8">UI · API · DATA · OPS in one orbit</text>
</svg>
