<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Joe Maina animated engineering terminal</title>
  <desc id="desc">A dark terminal window with animated commands describing secure full-stack systems, APIs, cybersecurity, and DevOps.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7dd3fc" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .prompt { fill: #67e8f9; }
      .command { fill: #f8fafc; }
      .output { fill: #cbd5e1; }
      .accent { fill: #fbbf24; }
      .line1 { animation: appear 9s infinite; }
      .line2 { animation: appear 9s 0.7s infinite; }
      .line3 { animation: appear 9s 1.4s infinite; }
      .line4 { animation: appear 9s 2.1s infinite; }
      .line5 { animation: appear 9s 2.8s infinite; }
      .line6 { animation: appear 9s 3.5s infinite; }
      .cursor { animation: blink 0.9s steps(1) infinite; }
      .scan { animation: scan 4.5s ease-in-out infinite; }
      @keyframes appear { 0%, 8% { opacity: 0; transform: translateY(7px); } 16%, 88% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
      @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
      @keyframes scan { 0%, 100% { transform: translateX(-330px); opacity: 0; } 15% { opacity: 0.55; } 85% { opacity: 0.55; } }
    </style>
  </defs>

  <rect x="12" y="12" width="876" height="306" rx="20" fill="url(#surface)" filter="url(#shadow)"/>
  <rect x="12" y="12" width="876" height="306" rx="20" fill="url(#grid)"/>
  <rect x="12" y="12" width="876" height="52" rx="20" fill="#172554" fill-opacity="0.72"/>
  <path d="M12 64h876" stroke="#38bdf8" stroke-opacity="0.18"/>
  <circle cx="44" cy="38" r="7" fill="#fb7185"/>
  <circle cx="68" cy="38" r="7" fill="#fbbf24"/>
  <circle cx="92" cy="38" r="7" fill="#34d399"/>
  <text x="450" y="43" text-anchor="middle" class="mono" font-size="15" fill="#94a3b8">joe@maina1-ke — secure-systems</text>

  <g class="mono" font-size="18">
    <g class="line1">
      <text x="42" y="105" class="prompt">joe@maina1-ke:~$</text>
      <text x="206" y="105" class="command">whoami</text>
    </g>
    <g class="line2">
      <text x="42" y="142" class="prompt">joe@maina1-ke:~$</text>
      <text x="206" y="142" class="command">focus --area "secure systems"</text>
    </g>
    <g class="line3">
      <text x="42" y="179" class="output">&gt; software engineer</text>
      <text x="42" y="205" class="output">&gt; full-stack · APIs · cybersecurity · DevOps</text>
    </g>
    <g class="line4">
      <text x="42" y="242" class="prompt">joe@maina1-ke:~$</text>
      <text x="206" y="242" class="command">build --ship --secure</text>
    </g>
    <g class="line5">
      <text x="42" y="279" class="accent">status:</text>
      <text x="124" y="279" class="output">ready for the next useful idea</text>
    </g>
    <rect class="cursor" x="42" y="292" width="11" height="20" rx="2" fill="#67e8f9"/>
  </g>

  <rect class="scan" x="12" y="64" width="330" height="2" fill="url(#glow)"/>
  <circle cx="822" cy="268" r="34" fill="#0b7285" fill-opacity="0.16" stroke="#67e8f9" stroke-opacity="0.42"/>
  <path d="M804 268h36M822 250v36M810 256l24 24M834 256l-24 24" stroke="#67e8f9" stroke-opacity="0.7" stroke-width="2"/>
  <text x="822" y="315" text-anchor="middle" class="mono" font-size="11" fill="#94a3b8">secure by design</text>
</svg>
