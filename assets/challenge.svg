<svg xmlns="http://www.w3.org/2000/svg" width="520" height="270" viewBox="0 0 520 270" role="img" aria-labelledby="title desc">
  <title id="title">1200-day build challenge</title>
  <desc id="desc">A clearly labeled 1200-day build challenge card, currently on day 582, separate from live GitHub contribution statistics.</desc>
  <defs>
    <linearGradient id="challenge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102a43"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, monospace; }
      .ring { transform-origin: 150px 143px; animation: ring 3s ease-in-out infinite alternate; }
      .spark { animation: spark 1.5s ease-in-out infinite alternate; }
      @keyframes ring { from { transform: scale(0.97); } to { transform: scale(1.03); } }
      @keyframes spark { from { opacity: 0.35; } to { opacity: 1; } }
    </style>
  </defs>
  <rect width="520" height="270" rx="22" fill="url(#challenge)"/>
  <circle cx="150" cy="143" r="76" fill="#0f172a" stroke="#334155" stroke-width="15"/>
  <circle class="ring" cx="150" cy="143" r="76" fill="none" stroke="#fbbf24" stroke-width="15" stroke-linecap="round" stroke-dasharray="232 246" transform="rotate(-90 150 143)"/>
  <text x="150" y="137" text-anchor="middle" class="mono" font-size="30" font-weight="700" fill="#fef3c7">1200</text>
  <text x="150" y="160" text-anchor="middle" class="mono" font-size="13" fill="#cbd5e1">DAY TARGET</text>
  <text x="270" y="77" class="mono" font-size="14" fill="#67e8f9" letter-spacing="2">BUILD CHALLENGE</text>
  <text x="270" y="118" class="mono" font-size="22" fill="#f8fafc">Day 582 / 1200</text>
  <text x="270" y="151" class="mono" font-size="13" fill="#cbd5e1">launched 26 Apr 2025</text>
  <text x="270" y="181" class="mono" font-size="12" fill="#94a3b8">goal: build useful technology</text>
  <g class="spark" fill="#fbbf24"><circle cx="438" cy="64" r="3"/><circle cx="464" cy="98" r="2"/><circle cx="420" cy="212" r="2.5"/></g>
  <text x="270" y="225" class="mono" font-size="11" fill="#94a3b8">live GitHub stats remain accurate</text>
</svg>
