<svg xmlns="http://www.w3.org/2000/svg" width="520" height="270" viewBox="0 0 520 270" role="img" aria-labelledby="title desc">
  <title id="title">Time-aware systems visual</title>
  <desc id="desc">An animated sun and moon pass over a digital horizon, representing systems that work across changing conditions.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172554"/><stop offset="0.58" stop-color="#0b7285"/><stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="13"/></filter>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, monospace; }
      .orbit { animation: orbit 12s ease-in-out infinite; }
      .moon { animation: moon 12s ease-in-out infinite; }
      .stars { animation: twinkle 2.2s ease-in-out infinite alternate; }
      .hands { transform-origin: 410px 192px; animation: clock 5s linear infinite; }
      @keyframes orbit { 0%, 100% { transform: translate(0, 28px); } 50% { transform: translate(290px, -36px); } }
      @keyframes moon { 0%, 45% { opacity: 0.08; transform: translate(290px, -36px); } 55%, 100% { opacity: 1; transform: translate(0, 28px); } }
      @keyframes twinkle { from { opacity: 0.3; } to { opacity: 0.9; } }
      @keyframes clock { to { transform: rotate(360deg); } }
    </style>
  </defs>
  <rect width="520" height="270" rx="22" fill="url(#sky)"/>
  <circle cx="245" cy="108" r="76" fill="#38bdf8" opacity="0.12" filter="url(#blur)"/>
  <g class="stars" fill="#fef3c7"><circle cx="70" cy="66" r="2"/><circle cx="135" cy="42" r="1.7"/><circle cx="300" cy="52" r="2"/><circle cx="454" cy="76" r="1.6"/><circle cx="375" cy="36" r="1.2"/></g>
  <g class="orbit"><circle cx="112" cy="100" r="30" fill="#fbbf24"/><circle cx="102" cy="91" r="7" fill="#fde68a" opacity="0.7"/><circle cx="124" cy="110" r="5" fill="#f59e0b" opacity="0.7"/></g>
  <g class="moon"><circle cx="400" cy="92" r="26" fill="#e2e8f0"/><circle cx="412" cy="84" r="26" fill="#172554"/></g>
  <path d="M0 178 Q115 147 235 180 T520 170V270H0Z" fill="url(#ground)"/>
  <path d="M0 184 Q125 153 235 186 T520 178" fill="none" stroke="#67e8f9" stroke-opacity="0.55"/>
  <g transform="translate(382 162)"><circle cx="28" cy="30" r="31" fill="#0f172a" stroke="#67e8f9" stroke-opacity="0.75"/><circle cx="28" cy="30" r="24" fill="none" stroke="#334155"/><g class="hands"><path d="M28 30V12M28 30l14 8" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/></g><circle cx="28" cy="30" r="3" fill="#fbbf24"/></g>
  <text x="28" y="35" class="mono" font-size="13" fill="#e0f2fe" letter-spacing="2">TIME-AWARE SYSTEMS</text>
  <text x="28" y="234" class="mono" font-size="13" fill="#94a3b8">day → night → day · resilient by design</text>
</svg>
